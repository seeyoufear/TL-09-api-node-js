name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25.x'

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Compose
        uses: hoverkraft-tech/compose-action@v2.4.1
        with:
            compose-file: ./docker-compose.yaml
            up-flags: -d

      - name: Run empty user controller tests
        run: npx playwright test tests/empty-user-controller.spec.ts

      - name: Run user controller tests
        run: npx playwright test tests/user-controller.test.ts
